# Quality gates CI (唯一正本)。2026-10-03 bun→pnpm 移行。
#
# 2026-09-19: AGENTS.md §6.3 was changed to allow direct writing to .github/workflows/.
# This file is the source, and .github/workflows/quality-gates.yml is the production file.
# Both are kept in sync.
#
# 2026-09-21: workflow_dispatch に inputs.job を追加し、手動で2ジョブ(quality/e2e)を個別実行可能に。

name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: 'Select job to run manually (all/quality/e2e)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - quality
          - e2e

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck / Lint / Unit / Coverage / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'quality' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm exec biome lint .

      - name: Determinism guard
        run: pnpm run check:determinism

      - name: Unit tests
        run: pnpm run test:unit

      - name: Coverage thresholds (85%)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: E2E spec discovery
        run: pnpm run test:e2e --list

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'e2e') && (needs.quality.result == 'success' || needs.quality.result == 'skipped' || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
