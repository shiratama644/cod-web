# ローカル開発用 Docker Compose
#
# PostgreSQL だけ(通常の開発。アプリはホストの bun で動かす):
#   bun run db:up      # 起動(healthy になるまで待機)
#   bun run db:down    # 停止(データは volume に残る)
#   bun run db:destroy # 停止+データ削除
#
# フルスタック(web :3000 + gameserver :8080 + postgres をコンテナで):
#   bun run app:up     # = docker compose --profile app up --build -d
#   bun run app:down
#
# 接続情報はデフォルトで apps/web/.env.example の DATABASE_URL と一致する。
# ポート等を変えたい場合はシェル環境変数(POSTGRES_PORT など)で上書きする。
name: cod-web

services:
  postgres:
    image: postgres:17-alpine
    container_name: cod-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # コンテナ内の環境変数を参照するため $$ でエスケープ
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: cod-web-web
    restart: unless-stopped
    environment:
      # コンテナ間はサービス名 `postgres` で解決する(127.0.0.1 ではない)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  gameserver:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
      target: gameserver
    container_name: cod-web-gameserver
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - '${GAMESERVER_PORT:-8080}:8080'

volumes:
  postgres-data:
