# ローカル開発用 PostgreSQL(apps/web の /api/loadouts が使用)
#
#   bun run db:up      # 起動(healthy になるまで待機)
#   bun run db:down    # 停止(データは volume に残る)
#   bun run db:destroy # 停止+データ削除
#
# 接続情報はデフォルトで apps/web/.env.example の DATABASE_URL と一致する。
# ポート等を変えたい場合はシェル環境変数(POSTGRES_PORT など)で上書きする。
name: cod-web

services:
  postgres:
    image: postgres:17-alpine
    container_name: cod-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # コンテナ内の環境変数を参照するため $$ でエスケープ
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
