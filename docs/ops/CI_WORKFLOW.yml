name: CI

on:
  push:
    branches: [main]
    # ドキュメント系の変更では CI を走らせない
    paths-ignore:
      - 'README.md'
      - 'AGENT.md'
      - '.agent/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENT.md'
      - '.agent/**'
      - 'docs/**'
  # Actions タブから手動実行も可能（初回配置後の動作確認に便利）
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 型・lint・ユニットテスト（最速で fail を検出する軽量ジョブ）
  # ==========================================================================
  static-checks:
    name: Type / Lint / Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version は package.json の packageManager から解決。
        # version を明示すると重複指定エラーで action が失敗するため書かない。
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================================================
  # ビルド（クライアント + サーバー）
  # ==========================================================================
  build:
    name: Build (client + server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ==========================================================================
  # E2E (Playwright): client 描画・入力・ゲームフロー
  # ==========================================================================
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    # 開発環境で Chromium install 不可の場合はローカル実行不可のため、
    # CI でのみ実行する。必要に応じトリガーを調整。
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
